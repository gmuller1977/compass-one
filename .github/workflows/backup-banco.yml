# Backup semanal do banco (25/10/2026, revisão técnica, escolha do Guilherme).
# O plano gratuito do Supabase não guarda cópia do banco. Todo domingo esta
# rotina copia as tabelas do app (schema public) e os logins (auth.users e
# auth.identities), tranca o arquivo com senha (AES-256, gpg) e guarda como
# artefato do GitHub por 90 dias. Como restaurar: docs/backup-do-banco.md.
#
# Segredos (Settings › Secrets and variables › Actions):
#   SUPABASE_DB_URL  conexão "Session pooler" do Supabase (o GitHub não alcança
#                    o endereço direto db.<ref>.supabase.co, que é só IPv6)
#   BACKUP_SENHA     senha do arquivo; sem ela o backup não abre
# Sem os dois, a rotina avisa e termina sem erro.
name: Backup do banco

on:
  schedule:
    - cron: '0 6 * * 0' # domingo, 3h em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-banco
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SENHA: ${{ secrets.BACKUP_SENHA }}
    steps:
      - name: Conferir segredos
        id: segredos
        run: |
          if [ -z "$DB_URL" ] || [ -z "$SENHA" ]; then
            echo "::warning::Backup não rodou: faltam SUPABASE_DB_URL e/ou BACKUP_SENHA nos segredos do repositório."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar pg_dump 17
        if: steps.segredos.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      # Mostra a forma do endereço sem a senha (só o tamanho e se tem símbolos
      # que quebram a URL), para achar erro de colagem no segredo.
      - name: Conferir o endereço
        if: steps.segredos.outputs.ok == 'true'
        run: |
          python3 - <<'EOF'
          import os, urllib.parse as u
          url = os.environ['DB_URL']
          p = u.urlsplit(url.strip())
          senha = p.password or ''
          print('espaço ou quebra de linha nas pontas:', url != url.strip())
          print('esquema:', p.scheme, '| usuário:', p.username, '| host:', p.hostname, '| porta:', p.port, '| banco:', p.path)
          print('senha: tamanho', len(senha), '| colchetes:', '[' in senha or ']' in senha,
                '| YOUR-PASSWORD:', 'YOUR-PASSWORD' in url.upper(),
                '| símbolos @#/?%:', any(c in senha for c in '@#/?%:'))
          print('arrobas no endereço:', url.count('@'))
          EOF

      - name: Copiar o banco
        if: steps.segredos.outputs.ok == 'true'
        run: |
          set -euo pipefail
          umask 077
          PGD=/usr/lib/postgresql/17/bin/pg_dump
          DIA=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          echo "DIA=$DIA" >> "$GITHUB_ENV"
          mkdir -p copia
          "$PGD" "$DB_URL" --schema=public --no-owner --no-privileges -Fc -f copia/public.dump
          "$PGD" "$DB_URL" --data-only --table=auth.users --table=auth.identities -Fc -f copia/auth.dump
          tar -czf - -C copia . | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SENHA" --symmetric --cipher-algo AES256 \
            -o "compass-one-banco-$DIA.tar.gz.gpg"
          rm -rf copia
          ls -lh "compass-one-banco-$DIA.tar.gz.gpg"

      - name: Guardar no GitHub
        if: steps.segredos.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compass-one-banco-${{ env.DIA }}
          path: compass-one-banco-${{ env.DIA }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
